services:
  - type: web
    name: volunteerops-backend
    runtime: node
    plan: standard
    region: oregon
    buildCommand: npm install && npm run prisma:generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        value: "https://volunteerops.org"
      - key: LOG_LEVEL
        value: "info"
