name: Docker build

on:
  push:
    branches: [main, "deploy/sentinel-production-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: sentinel_test_owner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_test_owner -d sentinel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DO_NOT_TRACK: '1'
      DATABASE_URL: postgresql://sentinel_test_owner:disposable-ci-password@127.0.0.1:5432/sentinel_test?sslmode=disable
      SENTINEL_TEST_DATABASE_URL: postgresql://sentinel_test_owner:disposable-ci-password@127.0.0.1:5432/sentinel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Rehearse migrations against disposable PostgreSQL 18
        run: npm exec -- prisma db migrate --db "$SENTINEL_TEST_DATABASE_URL"
      - name: Verify migrated contract
        run: npm exec -- prisma db verify --db "$SENTINEL_TEST_DATABASE_URL"
      - run: npm test
      - run: node --test scripts/deploy-railway.test.mjs
      - run: npm run contracts:check
      - run: npm run test:types
      - run: npm run test:object-store
      - run: npx playwright install --with-deps chromium
      - run: npm run test:portal
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Build the dedicated migration artifact
        run: docker build --pull -f deploy/railway/Dockerfile.migrate -t resq-migrate:build-check .
      - name: Build the production image
        run: docker build --pull -t volunteerops-backend:build-check .
      - name: Verify production artifacts and native dependencies
        run: |
          docker run --rm -i --network none \
            volunteerops-backend:build-check node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import argon2 from 'argon2';
          import { PrismaClient } from './dist/generated/prisma/client.js';
          import { PrismaPg } from '@prisma/adapter-pg';
          import { getAuth } from 'firebase-admin/auth';
          import { S3Client } from '@aws-sdk/client-s3';
          import { getSignedUrl } from '@aws-sdk/s3-request-presigner';

          assert.equal(process.getuid(), 1000, 'Run as the unprivileged node user');
          assert.equal(typeof PrismaClient, 'function');
          assert.equal(typeof PrismaPg, 'function');
          assert.equal(typeof getAuth, 'function');
          assert.equal(typeof S3Client, 'function');
          assert.equal(typeof getSignedUrl, 'function');
          assert.equal(existsSync('node_modules/typescript'), false, 'Omit development tools');
          assert.equal(existsSync('dist/portal/index.html'), true, 'Include the browser portal');
          assert.equal(existsSync('.env'), false, 'Do not bake credentials into the image');
          execFileSync(process.execPath, ['--check', 'dist/index.js'], { stdio: 'inherit' });
          const hash = await argon2.hash('build-check-password');
          assert.equal(await argon2.verify(hash, 'build-check-password'), true);
          assert.equal(await argon2.verify(hash, 'wrong-password'), false);
          console.log('Production artifact and native dependency checks passed');
          JS

      - name: Build the private object-store image
        run: docker build --pull -f deploy/object-store/Dockerfile -t volunteerops-storage:build-check .
      - name: Check isolated object-store startup and authenticated readiness
        run: |
          trap 'docker rm -f resq-storage-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name resq-storage-check --network none \
            -e S3_ENDPOINT=https://storage-ci.example.org -e S3_BUCKET=ci-private-objects \
            -e S3_REGION=us-east-1 \
            -e S3_ROOT_ACCESS_KEY_ID=CI_ROOT_KEY_00000001 \
            -e S3_ROOT_SECRET_ACCESS_KEY=disposable-ci-owner-secret-000000000000 \
            -e S3_ACCESS_KEY_ID=CI_RUNTIME_KEY_00001 \
            -e S3_SECRET_ACCESS_KEY=disposable-ci-runtime-secret-0000000000 \
            volunteerops-storage:build-check
          for attempt in $(seq 1 24); do
            if docker exec resq-storage-check node healthcheck.mjs; then exit 0; fi
            sleep 5
          done
          docker logs resq-storage-check
          exit 1

  deploy:
    needs: build-and-smoke
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: railway-staging
      url: https://resq-api-staging.up.railway.app/api/ready
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: npm install --global @railway/cli@5.62.1
      - name: Apply and verify migrations before releasing runtime services
        run: node scripts/deploy-railway.mjs migrate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy and verify API
        run: node scripts/deploy-railway.mjs api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy and verify forecast worker
        run: node scripts/deploy-railway.mjs forecast
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
